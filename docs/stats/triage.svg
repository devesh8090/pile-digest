<text x="24.0" y="30.0" class="t1" font-size="16" text-anchor="start" font-weight="600">How the 288 pages were handled</text><text x="24.0" y="52.0" class="t2" font-size="13" text-anchor="start" font-weight="400">Local triage decides, for free, which pages a model has to look at.</text><rect class="s1" x="24" y="64" width="10" height="10" rx="2"/><text x="39.0" y="73.0" class="t2" font-size="12" text-anchor="start" font-weight="400">Skipped or free: 5</text><rect class="s2" x="179.8" y="64" width="10" height="10" rx="2"/><text x="194.8" y="73.0" class="t2" font-size="12" text-anchor="start" font-weight="400">Good text layer: 95</text><rect class="s3" x="342.2" y="64" width="10" height="10" rx="2"/><text x="357.2" y="73.0" class="t2" font-size="12" text-anchor="start" font-weight="400">Read from the image: 188</text><rect class="s1" x="24.0" y="92" width="12.4" height="34"/><rect class="s2" x="36.4" y="92" width="234.9" height="34"/><line class="gap" x1="36.4" y1="92" x2="36.4" y2="126" stroke-width="2"/><text x="153.8" y="146.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">33% · cheap summary only</text><path class="s3" d="M271.2,92.0 H732.0 Q736.0,92.0 736.0,96.0 V122.0 Q736.0,126.0 732.0,126.0 H271.2 Z"/><line class="gap" x1="271.2" y1="92" x2="271.2" y2="126" stroke-width="2"/><text x="503.6" y="146.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">65% · cheap model, flagged pages escalated</text><text x="24.0" y="170.0" class="t3" font-size="11.5" text-anchor="start" font-weight="400">Skipped and free pages cost nothing; text-layer pages cost a few hundred cheap-model tokens; only image pages pay for vision.</text></svg>
