<svg xmlns="http://www.w3.org/2000/svg" width="760" height="186" viewBox="0 0 760 186" role="img" aria-labelledby="t d"><title id="t">How the pages were handled</title><desc id="d">Stacked bar of pages by treatment: Skipped or free 5, Good text layer 95, Read from the image 188</desc>
<style>
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6b6a65; }
  .grid { stroke: #e1e0d9; } .base { stroke: #c3c2b7; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s0 { fill: #a3a29b; }
  .hatch-line { stroke: #2a78d6; } .hatch-bg { fill: #2a78d6; fill-opacity: 0.18; }
  .gap { stroke: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #a3a29b; }
