    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s0 { fill: #6b6a65; }
    .hatch-line { stroke: #3987e5; } .hatch-bg { fill: #3987e5; fill-opacity: 0.22; }
