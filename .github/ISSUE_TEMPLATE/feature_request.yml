name: Feature request
description: A new input type, output profile, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: cost
    attributes:
      label: Effect on token cost
      description: pile-digest exists to save tokens. Would this change what is sent to models?
