name: Bug report
description: Something went wrong while digesting a pile
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python3 skills/pile-digest/scripts/pd.py doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran and the kind of files involved (please don't attach private documents; describe them or share a minimal sample you made yourself).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
